[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2latex-local"
version = "0.3.0"
description = "Local-first paper OCR and editable diagram conversion for Markdown, LaTeX, PDF, and draw.io."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "dreaminate" },
]
keywords = ["ocr", "latex", "markdown", "handwriting", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "Pillow>=10,<13",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
quality = [
  "opencv-python>=4.10,<6",
]

[project.urls]
Repository = "https://github.com/dreaminate/paper2latex-local"

[project.scripts]
paper2latex = "paper2latex_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper2latex_local = ["review.html"]
